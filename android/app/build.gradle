plugins {
    id "com.android.application"
    // AGP 9's built-in Kotlin currently bundles KGP 2.2.10 on every released
    // version (through at least 9.4.0), below Flutter's minimum supported
    // 2.2.20 - this isn't overridable from app code (flutter/flutter#183910).
    // Flutter's own tooling defaults to the same workaround: keep applying
    // the legacy Kotlin Gradle Plugin here and leave built-in Kotlin off
    // (android.builtInKotlin=false in gradle.properties) until AGP bumps its
    // bundled Kotlin version.
    // See https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.localEntertainmentGames.muscles_builder"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    buildFeatures {
        resValues = true
    }

    defaultConfig {
        applicationId = "com.localEntertainmentGames.muscles_builder"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        debug {}
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            signingConfig = signingConfigs.release
        }
    }

    flavorDimensions += "default"

    productFlavors {
        create("staging") {
            dimension = "default"
            applicationIdSuffix = ".staging"
            resValue "string", "app_name", "Muscles Builder Staging"
        }
        create("production") {
            dimension = "default"
            resValue "string", "app_name", "Muscles Builder"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:34.3.0")
}
