org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Building against Android Gradle Plugin 9+:
# - android.builtInKotlin stays off: every AGP 9 release so far (through at
#   least 9.4.0) bundles built-in Kotlin at KGP 2.2.10, below Flutter's
#   minimum supported 2.2.20, so builtInKotlin=true fails outright
#   (flutter/flutter#183910 - Flutter's own tooling defaults to this same
#   workaround). Revisit once AGP ships a bundled Kotlin >= 2.2.20.
# - android.newDsl stays off because Flutter's Gradle plugin still casts the
#   "android" extension to the legacy AbstractAppExtension/variant API
#   (flutter/flutter#166550); flip this once that migration lands upstream.
# See https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
android.builtInKotlin=false
android.newDsl=false
